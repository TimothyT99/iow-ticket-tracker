name: Scrape Twickets Ticket Prices

on:
  # ── Scheduled runs ───────────────────────────────────────────────────────
  # Alert email analysis (21–27 Apr): all IoW Twickets listings appear
  # 07:30–21:00 UK time with burst clusters. Zero overnight activity.
  # Target: hourly coverage 07:00–22:00 BST = 06:00–21:00 UTC.
  #
  # Budget (GitHub Actions free tier: 2,000 min/month, private repo):
  #   With Playwright browser caching: ~4 min/run
  #   Peak season (Mar–Jun): 15 runs/day × 4 min × 31 days = 1,860 min ✅
  #   Off-season: 1 run/day × 4 min × 31 days = 124 min ✅
  #
  # Peak schedule: hourly 07–21 UTC covers 08:00–22:00 BST (core activity window)
  #   + shoulder runs at 06 and 22 UTC for early risers / late evening.
  schedule:
    - cron: '0 6-22 * 3-6 *'     # Mar–Jun: hourly, 06:00–22:00 UTC (= 07:00–23:00 BST)
    - cron: '0 8 * 1-2,7-12 *'   # Jan–Feb + Jul–Dec: once daily 08:00 UTC

  # ── Push trigger (workflow file changes only) ─────────────────────────────
  # Prevents "No jobs were run" check-suite failures when the workflow file
  # is updated. The job's if: condition skips execution on push events so
  # no actual scrape runs — just a clean green check.
  push:
    paths:
      - '.github/workflows/scrape.yml'

  # ── Manual trigger ───────────────────────────────────────────────────────
  # Run from GitHub → Actions → "Scrape Twickets Ticket Prices" → Run workflow
  workflow_dispatch:
    inputs:
      year:
        description: 'Festival year to scrape (e.g. 2026, 2027)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — scrape only, do not commit data'
        required: false
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip on push events — push trigger exists only to prevent "No jobs were run"
    # check-suite failures when this file is updated. Actual scrapes run on schedule
    # or workflow_dispatch only.
    if: github.event_name != 'push'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        working-directory: scraper
        run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          # Cache key tied to package-lock so a Playwright version bump busts it
          key: playwright-chromium-${{ hashFiles('scraper/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: scraper
        # Always run so system deps (apt) are present; browser download skipped on cache hit
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        working-directory: scraper
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.year }}" ]; then
            ARGS="$ARGS --year ${{ github.event.inputs.year }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node scrape.js $ARGS

      - name: Commit updated data
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  'IoW Ticket Bot'
          git config user.email 'bot@noreply.github.com'
          git add data/snapshots.json data/events.json
          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "No changes to commit (snapshot already exists for today)"
          else
            # Derive code version from latest non-data tag or default
            CODE_VERSION=$(git tag --sort=-version:refname | grep '^v' | head -1 || echo "v1.000")
            SNAP_COUNT=$(node -e "const d=require('./data/snapshots.json'); console.log(d.snapshots.length)" 2>/dev/null || echo "?")
            TRIGGER="${{ github.event_name == 'workflow_dispatch' && 'manual' || 'scheduled' }}"
            git commit -m "data: snapshot $(date +'%Y-%m-%d') @ ${CODE_VERSION}" -m \
"Automated Twickets price scrape — ${TRIGGER} run.

Snapshot #${SNAP_COUNT} appended to data/snapshots.json.
Source: https://www.twickets.live/en/event/ (IoW Festival resale)
Trigger: ${TRIGGER} (GitHub Actions)
Runner: ubuntu-latest / Node 20 / Playwright chromium

Netlify rebuild triggered on push."
            git push
            echo "✅ Data committed and pushed — Netlify rebuild triggered"
          fi
