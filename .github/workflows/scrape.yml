name: Scrape Twickets Ticket Prices

on:
  # ── Scheduled runs ───────────────────────────────────────────────────────
  # Daily at 08:00 UTC — smart skip logic in scrape.js handles off-season
  schedule:
    - cron: '0 8 * * *'

  # ── Manual trigger ───────────────────────────────────────────────────────
  # Run from GitHub → Actions → "Scrape Twickets Ticket Prices" → Run workflow
  workflow_dispatch:
    inputs:
      year:
        description: 'Festival year to scrape (e.g. 2026, 2027)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — scrape only, do not commit data'
        required: false
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        working-directory: scraper
        run: npm ci

      - name: Install Playwright browsers
        working-directory: scraper
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        working-directory: scraper
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.year }}" ]; then
            ARGS="$ARGS --year ${{ github.event.inputs.year }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node scrape.js $ARGS

      - name: Commit updated data
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  'IoW Ticket Bot'
          git config user.email 'bot@noreply.github.com'
          git add data/snapshots.json data/events.json
          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "No changes to commit (snapshot already exists for today)"
          else
            # Derive code version from latest non-data tag or default
            CODE_VERSION=$(git tag --sort=-version:refname | grep '^v' | head -1 || echo "v1.000")
            SNAP_COUNT=$(node -e "const d=require('./data/snapshots.json'); console.log(d.snapshots.length)" 2>/dev/null || echo "?")
            TRIGGER="${{ github.event_name == 'workflow_dispatch' && 'manual' || 'scheduled' }}"
            git commit -m "data: snapshot $(date +'%Y-%m-%d') @ ${CODE_VERSION}" -m \
"Automated Twickets price scrape — ${TRIGGER} run.

Snapshot #${SNAP_COUNT} appended to data/snapshots.json.
Source: https://www.twickets.live/en/event/ (IoW Festival resale)
Trigger: ${TRIGGER} (GitHub Actions)
Runner: ubuntu-latest / Node 20 / Playwright chromium

Netlify rebuild triggered on push."
            git push
            echo "✅ Data committed and pushed — Netlify rebuild triggered"
          fi
