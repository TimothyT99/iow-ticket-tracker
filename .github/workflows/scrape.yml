name: Scrape Twickets Ticket Prices

on:
  # ── Scheduled runs ───────────────────────────────────────────────────────
  # Primary 15-min triggering is handled by cron-job.org via workflow_dispatch
  # (GitHub's own scheduler throttles to ~hourly on public repos).
  #
  # These fallback schedules activate if cron-job.org goes down:
  #   Peak (Mar–Jun): hourly 07:00–21:00 UTC — keeps data flowing as a safety net
  #   Off-season: once daily 08:00 UTC
  schedule:
    - cron: '0 7-21 * 3-6 *'    # Mar–Jun fallback: hourly 07:00–21:00 UTC
    - cron: '0 8 * 1-2,7-12 *'  # Jan–Feb + Jul–Dec: once daily 08:00 UTC

  # ── Push trigger (workflow file changes only) ─────────────────────────────
  # Prevents "No jobs were run" check-suite failures when the workflow file
  # is updated. The job's if: condition skips execution on push events so
  # no actual scrape runs — just a clean green check.
  push:
    paths:
      - '.github/workflows/scrape.yml'

  # ── Manual trigger ───────────────────────────────────────────────────────
  # Run from GitHub → Actions → "Scrape Twickets Ticket Prices" → Run workflow
  workflow_dispatch:
    inputs:
      year:
        description: 'Festival year to scrape (e.g. 2026, 2027)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — scrape only, do not commit data'
        required: false
        type: boolean
        default: false

jobs:
  # Runs only on push events (when scrape.yml itself is changed).
  # Exists solely to give GitHub a green check — no scraping happens.
  ack-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - run: echo "scrape.yml updated — scraper runs on schedule/dispatch only, not on push."

  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'push'
    permissions:
      contents: write   # needed to commit + push snapshot data

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        working-directory: scraper
        run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          # Cache key tied to package-lock so a Playwright version bump busts it
          key: playwright-chromium-${{ hashFiles('scraper/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: scraper
        # Always run so system deps (apt) are present; browser download skipped on cache hit
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        working-directory: scraper
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.year }}" ]; then
            ARGS="$ARGS --year ${{ github.event.inputs.year }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node scrape.js $ARGS

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshot-${{ github.run_id }}
          path: failure-screenshot.png
          if-no-files-found: ignore

      - name: Commit updated data
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  'IoW Ticket Bot'
          git config user.email 'bot@noreply.github.com'
          git add data/snapshots.json data/events.json public/data/snapshots.json
          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "No changes to commit (snapshot already exists within last 12 min, or scraper skipped)"
          else
            # Derive code version from latest non-data tag or default
            CODE_VERSION=$(git tag --sort=-version:refname | grep '^v' | head -1 || echo "v1.000")
            SNAP_COUNT=$(node -e "const d=require('./data/snapshots.json'); console.log(d.snapshots.length)" 2>/dev/null || echo "?")
            TRIGGER="${{ github.event_name == 'workflow_dispatch' && 'manual' || 'scheduled' }}"
            git commit \
              -m "data: snapshot $(date +'%Y-%m-%d') @ ${CODE_VERSION}" \
              -m "Scrape #${SNAP_COUNT} — ${TRIGGER} run. Source: twickets.live IoW Festival resale. Netlify rebuild triggered."
            # Push with rebase retry — cron-job.org and the GitHub Actions hourly fallback
            # both fire at :00, causing concurrent runs. If the push is rejected (non-fast-forward),
            # rebase onto the latest remote state and retry once. If another run already committed
            # the same snapshot window the dedup check will have prevented a duplicate.
            git push || (git pull --rebase origin main && git push)
            echo "✅ Data committed and pushed — Netlify rebuild triggered"
          fi
